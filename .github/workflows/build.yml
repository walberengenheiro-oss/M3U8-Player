name: Build M3U8 Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'M3U8_Player_AndroidStudio_REAL.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q -o M3U8_Player_AndroidStudio_REAL.zip -d buildsrc
          test -f buildsrc/M3U8_Player_AndroidStudio_REAL/settings.gradle

      - name: Build debug APK
        working-directory: buildsrc/M3U8_Player_AndroidStudio_REAL
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp buildsrc/M3U8_Player_AndroidStudio_REAL/app/build/outputs/apk/debug/app-debug.apk M3U8_Player.apk
          ls -lh M3U8_Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3U8-Player-APK
          path: M3U8_Player.apk
          if-no-files-found: error
          retention-days: 30
